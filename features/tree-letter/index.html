<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#171412" />
    <title>허들링 트리</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pinyon+Script&display=swap" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app">
      <!-- 조 번호 없이 들어온 경우 -->
      <section class="screen screen--center" data-screen="team" hidden>
        <div class="head">
          <h1 class="title">어느 조 트리로 갈까요?</h1>
          <p class="sub">받은 링크가 있다면 그 링크로 들어오면 바로 열려요.</p>
        </div>
        <div class="team-grid" id="teamGrid"></div>
      </section>

      <!-- ① 메인 -->
      <section class="screen" data-screen="home" hidden>
        <svg class="spark spark--left" viewBox="0 0 28 28" aria-hidden="true"><path d="M14 0v28M0 14h28M4.5 4.5l19 19M23.5 4.5l-19 19" /></svg>
        <svg class="spark spark--right" viewBox="0 0 28 28" aria-hidden="true"><path d="M14 0v28M0 14h28M4.5 4.5l19 19M23.5 4.5l-19 19" /></svg>
        <div class="head">
          <span class="chip" data-team-label></span>
          <p class="sub">허들링 클럽 연말 크리스마스 트리 꾸미기</p>
          <h1 class="title title--script">Merry<br />Huddling Tree</h1>
        </div>
        <div class="hero"></div>
        <div class="foot">
          <button class="btn btn--ghost" id="startBtn" type="button" data-team-start>트리 꾸미러 가기</button>
        </div>
      </section>

      <!-- ② 닉네임 -->
      <section class="screen" data-screen="nick" hidden>
        <div class="bar">
          <button class="icon-btn" id="nickBack" type="button" aria-label="뒤로 가기">
            <i data-lucide="arrow-left"></i>
          </button>
        </div>
        <form class="nick-form" id="nickForm" autocomplete="off">
          <div class="head head--left">
            <h1 class="title">닉네임을 입력해 주세요</h1>
            <p class="sub">이 이름으로 우리 조 트리에 참여해요. 편지에 표시돼요.</p>
          </div>
          <label class="field">
            <input id="nickInput" class="input" type="text" placeholder="닉네임" enterkeyhint="done" />
            <span class="count" id="nickCount"></span>
          </label>
          <div class="spacer"></div>
          <div class="foot">
            <button class="btn btn--primary" id="nickNext" type="submit" disabled>다음으로</button>
          </div>
        </form>
      </section>

      <!-- ③ 트리 꾸미기 -->
      <section class="screen screen--decorate" data-screen="decorate" hidden>
        <div class="bar bar--decorate">
          <button class="icon-btn icon-btn--solid" id="shareBtn" type="button" aria-label="링크 공유">
            <i data-lucide="link"></i>
          </button>
          <span class="bar-title" data-team-title></span>
          <button class="icon-btn icon-btn--solid" id="letterBtn" type="button" aria-label="편지 열기">
            <i data-lucide="mail"></i>
            <span class="badge" id="letterBadge" hidden></span>
          </button>
        </div>

        <div class="canvas" id="canvas">
          <div class="tree-box" id="treeBox">
            <div data-tree></div>
            <div class="orn-layer" id="ornLayer"></div>
          </div>
        </div>

        <div class="sheet">
          <p class="hint" id="sheetHint"></p>
          <div class="items-wrap" id="itemsWrap"><div class="items" id="items"></div></div>
        </div>
      </section>
    </div>

    <!-- ④ 편지 보기 · 남기기 (전체 모달) -->
    <dialog class="letters" id="letterDialog" aria-labelledby="letterTitle">
      <div class="letters-inner">
        <div class="bar bar--letters">
          <span class="bar-side"></span>
          <h2 class="bar-title" id="letterTitle">편지</h2>
          <button class="icon-btn" id="letterClose" type="button" aria-label="닫기">
            <i data-lucide="x"></i>
          </button>
        </div>
        <div class="letter-list" id="letterList"></div>
        <form class="composer" id="letterForm" autocomplete="off">
          <div class="input-row">
            <label class="field field--grow">
              <input id="letterInput" class="input" type="text" placeholder="메시지 남기기" enterkeyhint="send" />
              <span class="count" id="letterCount"></span>
            </label>
            <button class="btn btn--primary btn--inline" id="letterSend" type="submit" disabled>남기기</button>
          </div>
        </form>
      </div>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
