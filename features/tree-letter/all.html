<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#150402" />
    <title>모두의 트리 · Merry Huddling Tree</title>
    <meta name="description" content="허들링 클럽 16개 조의 크리스마스 트리를 한 화면에서 실시간으로 모아 봐요." />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" href="./img/orn-penguin-santa.png" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pinyon+Script&display=swap" />
    <link rel="stylesheet" href="./all.css" />
  </head>
  <body>
    <!-- 1920 × 1080 기준으로 그리고, 화면 크기에 맞춰 통째로 줄이거나 키워요. -->
    <div class="stage-wrap">
      <main class="stage" id="stage">
        <div class="glow" aria-hidden="true"></div>
        <div class="lights" id="lights" aria-hidden="true"></div>

        <header class="head">
          <p class="sub">허들링 클럽 연말 크리스마스 트리 꾸미기</p>
          <h1 class="title">Merry Huddling Tree</h1>
          <span class="chip" id="summary">16개 조 · 모두의 트리</span>
        </header>

        <section class="rows" id="rows" aria-label="조별 트리"></section>

        <p class="foot">트리를 누르면 그 조의 트리로 이동해요</p>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="./all.js"></script>
  </body>
</html>
